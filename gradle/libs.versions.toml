[versions]
agp                    = "8.7.3"
kotlin                 = "2.0.0"
ksp                    = "2.0.0-1.0.21"
coroutines             = "1.8.1"
compose-bom            = "2024.10.01"
lifecycle              = "2.8.4"
activity-compose       = "1.9.1"
core-ktx               = "1.13.1"
navigation-compose     = "2.7.7"
room                   = "2.6.1"
retrofit               = "2.11.0"
okhttp                 = "4.12.0"
moshi                  = "1.15.1"
coil                   = "2.6.0"
markwon                = "4.6.2"
paging                 = "3.3.0"
security-crypto        = "1.1.0-alpha06"
biometric              = "1.1.0"
browser                = "1.8.0"
glance                 = "1.1.0"
datastore              = "1.1.1"
posthog                = "3.9.1"
junit                  = "4.13.2"
junit5                 = "5.10.2"
mockk                  = "1.13.11"
mockwebserver          = "4.12.0"
robolectric            = "4.16"
androidx-test-core     = "1.6.1"
espresso               = "3.6.1"
wear-compose           = "1.4.0"
play-services-wearable = "18.2.0"

[libraries]
androidx-core-ktx           = { module = "androidx.core:core-ktx",                      version.ref = "core-ktx" }
androidx-lifecycle-runtime  = { module = "androidx.lifecycle:lifecycle-runtime-ktx",     version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose",           version.ref = "activity-compose" }
kotlinx-coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

compose-bom                 = { module = "androidx.compose:compose-bom",                 version.ref = "compose-bom" }
compose-ui                  = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling" }
compose-material3           = { module = "androidx.compose.material3:material3" }
compose-material-icons      = { module = "androidx.compose.material:material-icons-extended" }
compose-foundation          = { module = "androidx.compose.foundation:foundation" }
navigation-compose          = { module = "androidx.navigation:navigation-compose",       version.ref = "navigation-compose" }

room-runtime                = { module = "androidx.room:room-runtime",                   version.ref = "room" }
room-ktx                    = { module = "androidx.room:room-ktx",                       version.ref = "room" }
room-paging                 = { module = "androidx.room:room-paging",                    version.ref = "room" }
room-compiler                = { module = "androidx.room:room-compiler",                 version.ref = "room" }

retrofit                    = { module = "com.squareup.retrofit2:retrofit",               version.ref = "retrofit" }
retrofit-moshi               = { module = "com.squareup.retrofit2:converter-moshi",       version.ref = "retrofit" }
okhttp                      = { module = "com.squareup.okhttp3:okhttp",                   version.ref = "okhttp" }
okhttp-logging               = { module = "com.squareup.okhttp3:logging-interceptor",     version.ref = "okhttp" }
moshi                       = { module = "com.squareup.moshi:moshi",                      version.ref = "moshi" }
moshi-kotlin                 = { module = "com.squareup.moshi:moshi-kotlin-codegen",      version.ref = "moshi" }

coil-compose                = { module = "io.coil-kt:coil-compose",                       version.ref = "coil" }

markwon-core                = { module = "io.noties.markwon:core",                        version.ref = "markwon" }
markwon-ext-strikethrough    = { module = "io.noties.markwon:ext-strikethrough",          version.ref = "markwon" }
markwon-linkify              = { module = "io.noties.markwon:linkify",                    version.ref = "markwon" }
markwon-html                 = { module = "io.noties.markwon:html",                       version.ref = "markwon" }

paging-runtime               = { module = "androidx.paging:paging-runtime-ktx",           version.ref = "paging" }
paging-compose                = { module = "androidx.paging:paging-compose",              version.ref = "paging" }

security-crypto              = { module = "androidx.security:security-crypto",            version.ref = "security-crypto" }
biometric                    = { module = "androidx.biometric:biometric",                 version.ref = "biometric" }
androidx-browser              = { module = "androidx.browser:browser",                     version.ref = "browser" }

glance-appwidget              = { module = "androidx.glance:glance-appwidget",            version.ref = "glance" }
glance-material3               = { module = "androidx.glance:glance-material3",           version.ref = "glance" }

datastore-preferences          = { module = "androidx.datastore:datastore-preferences",   version.ref = "datastore" }

posthog-android              = { module = "com.posthog:posthog-android",                  version.ref = "posthog" }

junit                        = { module = "junit:junit",                                  version.ref = "junit" }
junit5-jupiter                = { module = "org.junit.jupiter:junit-jupiter",             version.ref = "junit5" }
mockk                         = { module = "io.mockk:mockk",                              version.ref = "mockk" }
mockwebserver                 = { module = "com.squareup.okhttp3:mockwebserver",          version.ref = "mockwebserver" }
robolectric                   = { module = "org.robolectric:robolectric",                 version.ref = "robolectric" }
androidx-test-core             = { module = "androidx.test:core",                         version.ref = "androidx-test-core" }
androidx-espresso-core         = { module = "androidx.test.espresso:espresso-core",       version.ref = "espresso" }
compose-ui-test-junit4          = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest        = { module = "androidx.compose.ui:ui-test-manifest" }

wear-compose-material   = { module = "androidx.wear.compose:compose-material",     version.ref = "wear-compose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation",   version.ref = "wear-compose" }
play-services-wearable  = { module = "com.google.android.gms:play-services-wearable", version.ref = "play-services-wearable" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
android-library      = { id = "com.android.library",                 version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
